<template name="hourly">

  {{#if Template.subscriptionsReady}}

    <div class="flow-text current">
      Current reading is {{currentDepth}} inches down {{age}}
    </div>
    <div class="flow-text current">
      {{currentHeight}} inches of water in tank<br/>
      {{gallons}} out of {{capacity}} gallons<br> 
      Range {{minHeight}} -> {{maxHeight}}
    </div>
    
    <div id="gaugeChart"></div>

    
    <h4>
      Hourly
      <span class="flow-text trend right">{{change}}</span>
    </h4>
    <div id="hourlyChart"></div>
  {{else}}
    ...
  {{/if}}


</template>

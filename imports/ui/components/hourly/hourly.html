<template name="hourly">

  {{#if Template.subscriptionsReady}}
    {{#if haveCurrentDepth}}
      <div class="flow-text current">
        Current reading is {{currentDepth}} inches down {{age}}
        {{#if overCapacity}}
          &nbsp; <a class="btn-small pulse yellow"><i class="material-icons">water</i></a>
          &nbsp; <i class="smaller">Sensor reading is {{currentReading}} inches</i>
        {{/if}}
      </div>
      <div class="flow-text current">
        {{currentHeight}} inches of water in tank &nbsp;
        {{#if haveRange}}
          <span class="range"> &nbsp; Range {{minHeight}} -> {{maxHeight}}</span>
        {{/if}}
        <br/>
        {{gallons}} out of {{capacity}} gallons{{#if isDown}}, down {{down}} gallons{{/if}}     
      </div>
    {{/if}}
    
    <div id="gaugeChart"></div>

    
    <h4>
      Hourly
      <span class="flow-text trend right">{{change1}}<br/>{{change2}}</span>
    </h4>
    <div id="hourlyChart"></div>
  {{else}}
    ...
  {{/if}}


</template>
